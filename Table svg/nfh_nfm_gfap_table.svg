<svg viewBox="0 0 580 160" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" role="img">
  <title>NfH, NfM, GFAP, b-Tubulin recovery table</title>

  <!-- Header -->
  <rect x="0" y="0" width="580" height="36" fill="#ffffff"/>
  <line x1="0" y1="36" x2="580" y2="36" stroke="#aaaaaa" stroke-width="1.2"/>

  <text x="14" y="23" font-size="12" fill="#777777">pg/ml</text>
  <text x="145" y="23" font-size="12" fill="#333333" font-weight="500" text-anchor="middle">NfH</text>
  <text x="255" y="23" font-size="12" fill="#333333" font-weight="500" text-anchor="middle">NfM</text>
  <text x="365" y="23" font-size="12" fill="#333333" font-weight="500" text-anchor="middle">GFAP</text>
  <text x="490" y="23" font-size="12" fill="#333333" font-weight="500" text-anchor="middle">b-Tubulin</text>

  <!-- Row: 5000 -->
  <rect x="0" y="36" width="580" height="34" fill="#ffffff"/>
  <line x1="0" y1="70" x2="580" y2="70" stroke="#e8e8e8" stroke-width="0.5"/>
  <text x="14" y="57" fill="#666666">5000</text>
  <text x="145" y="57" fill="#444444" text-anchor="middle">1.43 (21%)</text>
  <text x="255" y="57" fill="#444444" text-anchor="middle">1.57 (8%)</text>
  <text x="365" y="57" fill="#444444" text-anchor="middle">1.58 (10%)</text>
  <text x="490" y="57" fill="#444444" text-anchor="middle">1.54 (18%)</text>

  <!-- Row: 10000 -->
  <rect x="0" y="70" width="580" height="34" fill="#f9f9f8"/>
  <line x1="0" y1="104" x2="580" y2="104" stroke="#e8e8e8" stroke-width="0.5"/>
  <text x="14" y="91" fill="#666666">10000</text>
  <text x="145" y="91" fill="#444444" text-anchor="middle">1.60 (4%)</text>
  <text x="255" y="91" fill="#444444" text-anchor="middle">1.62 (8%)</text>
  <text x="365" y="91" fill="#444444" text-anchor="middle">1.54 (22)</text>
  <text x="490" y="91" fill="#444444" text-anchor="middle">1.59 (9%)</text>

  <!-- Row: 50000 -->
  <rect x="0" y="104" width="580" height="34" fill="#ffffff"/>
  <line x1="0" y1="138" x2="580" y2="138" stroke="#cccccc" stroke-width="1"/>
  <text x="14" y="125" fill="#666666">50000</text>
  <text x="145" y="125" fill="#444444" text-anchor="middle">1.68 (1%)</text>
  <text x="255" y="125" fill="#444444" text-anchor="middle">1.68 (1%)</text>
  <text x="365" y="125" fill="#444444" text-anchor="middle">1.62 (8%)</text>
  <text x="490" y="125" fill="#444444" text-anchor="middle">1.53 (2%)</text>
</svg>
